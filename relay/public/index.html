<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Talkshow — Deepgram Streaming Test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 20px; }
  #status { color: #888; font-size: 13px; margin-bottom: 20px; }
  #status.live { color: #1a8a4a; font-weight: 600; }
  button { padding: 10px 20px; font-size: 14px; border-radius: 6px; border: 1px solid #ccc; cursor: pointer; margin-right: 8px; }
  #start { background: #1a1a1a; color: white; border: none; }
  #start:disabled, #stop:disabled { opacity: 0.4; cursor: not-allowed; }
  #transcript { margin-top: 24px; padding: 16px; background: #f5f5f5; border-radius: 8px; min-height: 120px; line-height: 1.6; font-size: 16px; }
  #interim { color: #999; font-style: italic; }
</style>
</head>
<body>
  <h1>Deepgram Streaming Test</h1>
  <p id="status">Idle — click Start and allow mic access</p>
  <button id="start">Start</button>
  <button id="stop" disabled>Stop</button>
  <div id="transcript"><span id="final"></span><span id="interim"></span></div>

  <script>
    let mediaRecorder;
    let socket;
    let mediaStream;

    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const statusEl = document.getElementById('status');
    const finalEl = document.getElementById('final');
    const interimEl = document.getElementById('interim');

    startBtn.onclick = async () => {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        statusEl.textContent = 'Mic access denied — check browser permissions';
        return;
      }

      socket = new WebSocket(`ws://${location.host}`);

      socket.onopen = () => {
        statusEl.textContent = 'Connected — listening';
        statusEl.className = 'live';

        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'audio/webm;codecs=opus' });

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0 && socket.readyState === WebSocket.OPEN) {
            socket.send(event.data);
          }
        };

        // Emit a chunk every 250ms — small enough for low latency,
        // large enough not to flood the socket.
        mediaRecorder.start(250);
      };

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.is_final) {
          finalEl.textContent += data.transcript + ' ';
          interimEl.textContent = '';
        } else {
          interimEl.textContent = data.transcript;
        }
      };

      socket.onerror = () => {
        statusEl.textContent = 'Connection error — check server logs';
      };

      socket.onclose = () => {
        statusEl.textContent = 'Disconnected';
        statusEl.className = '';
      };

      startBtn.disabled = true;
      stopBtn.disabled = false;
    };

    stopBtn.onclick = () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if (mediaStream) mediaStream.getTracks().forEach((t) => t.stop());
      if (socket) socket.close();
      statusEl.textContent = 'Stopped';
      statusEl.className = '';
      startBtn.disabled = false;
      stopBtn.disabled = true;
    };
  </script>
</body>
</html>
